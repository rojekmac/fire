function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function decryptWith(pw){
  const salt=b64d(SALT), iv=b64d(IV), data=b64d(CT);
  const bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},
    bk,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data);
  return new TextDecoder().decode(buf);
}
async function unlock(pw,fromStore){
  try{
    const html=await decryptWith(pw);
    try{sessionStorage.setItem("etpw",pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{sessionStorage.removeItem("etpw");}catch(_){}
    if(!fromStore){const m=document.getElementById("msg");if(m)m.textContent="Wrong password";
      const p=document.getElementById("pw");if(p){p.value="";p.focus();}}
  }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();
  unlock(document.getElementById("pw").value,false);});
(function(){const s=sessionStorage.getItem("etpw");if(s)unlock(s,true);})();
